:1px solid #c5d1df;background:#f5f8fc;border-radius:10px;padding:10px;text-align:center;touch-action:none}.stackbox svg{width:100%;max-width:170px;height:180px;touch-action:none}.stackbox .caption{font-size:13px}.sample{text-align:center;margin-bottom:15px}.sample svg{height:110px;width:100px}.target{font-size:14px}.reflexgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:370px;margin:15px auto;position:relative}.cell{aspect-ratio:1;border:1px solid #a9bfd9;background:#eef5fd;border-radius:9px;display:grid;place-items:center;font-size:45px;cursor:pointer;user-select:none}.flash{position:absolute;inset:0;display:grid;place-items:center;font-size:180px;font-weight:bold;pointer-events:none;opacity:0}.flash.show{opacity:.82}.result{font-size:82px;font-weight:bold;text-align:center;padding:20px}.hide{display:none!important}@media(max-width:600px){.app{margin:0;border-radius:0}.top{padding:15px}.top strong{font-size:18px}.page{padding:16px}.panel{padding:16px}.stackbox{padding:4px}.stackbox svg{height:155px}.flash{font-size:125px}}

</div><script src="image_manifest.js"></script><script>const QUESTIONS=[["仕事で最初に確認することは？", "目的", "締切", "担当者", "報酬"], ["予定外の仕事を頼まれたら？", "優先順位を確認", "すぐ引き受ける", "断る", "周囲に相談"], ["苦手な作業を任されたら？", "調べて挑戦", "得意な人に聞く", "別の役割を提案", "後回しにする"], ["チームで意見が割れたら？", "根拠を比較", "多数決", "リーダーに任せる", "自分の案を主張"], ["失敗に気づいたら？", "すぐ報告", "まず修正", "原因を分析", "様子を見る"], ["初めての職場で重視することは？", "仕事内容", "人間関係", "待遇", "成長機会"], ["作業の進め方は？", "計画して進める", "すぐ着手", "相談しながら", "状況に合わせる"], ["急な変更への対応は？", "計画を組み直す", "すぐ切り替える", "理由を確認", "支援を求める"], ["成果を評価する基準は？", "正確さ", "速さ", "創造性", "協調性"], ["新しい技術が導入されたら？", "試して学ぶ", "説明を聞く", "必要になるまで待つ", "詳しい人に任せる"], ["集中しやすい環境は？", "静かな場所", "適度ににぎやか", "人と一緒", "場所を選ばない"], ["締切が近いときは？", "重要部分を優先", "作業時間を増やす", "応援を頼む", "品質を再確認"], ["得意な役割は？", "企画", "実行", "調整", "検証"], ["説明が曖昧な指示を受けたら？", "質問する", "仮案を作る", "過去例を探す", "周囲に聞く"], ["職場で学びたいことは？", "専門知識", "対人能力", "管理能力", "新しい発想"], ["単調な仕事が続いたら？", "改善を探す", "正確に続ける", "休憩を工夫", "別の仕事を希望"], ["意見を求められたら？", "率直に伝える", "根拠を添える", "周囲を聞いてから", "必要な点だけ伝える"], ["仕事で達成感がある瞬間は？", "完成したとき", "感謝されたとき", "問題を解決したとき", "新しい発見をしたとき"], ["複数の依頼が重なったら？", "期限順", "重要度順", "依頼順", "相談して決める"], ["判断材料が足りないときは？", "情報を集める", "仮説で進める", "経験者に相談", "判断を保留"], ["新しい企画を考えるなら？", "需要を調べる", "試作品を作る", "仲間と話す", "成功例を研究"], ["競争と協力では？", "競争が得意", "協力が得意", "両方必要", "状況による"], ["指摘を受けたときは？", "改善点を聞く", "すぐ修正", "理由を説明", "一度整理する"], ["長期目標の立て方は？", "細かく分割", "大きな方向だけ", "定期的に見直す", "流れに任せる"], ["仕事で大切にしたいことは？", "安定", "挑戦", "自由", "社会への貢献"], ["最後に、自分の強みは？", "継続力", "判断力", "発想力", "協調性"]];
(()=>{'use strict';const $=id=>document.getElementById(id);let questions=QUESTIONS,q=0,answers=[],solved=0,hits=0,misses=0,reflexTimer=null,spawnTimer=null,activeSymbol=null,reflexRunning=false,drag=null;const colors=['#E84D4D','#F2C94C','#2787DC'];const puzzles=[{start:[[0,1,2],[],[]],target:[0,2,1]},{start:[[2,0],[1],[]],target:[1,2,0]},{start:[[1,2],[0],[]],target:[2,1,0]}];let stacks=[],puzzleIndex=0;
let currentNumber=null;function enterForm(){currentNumber=Math.floor(Math.random()*9999)+1;$('numberDisplay').textContent=String(currentNumber);show('form')}function show(id){for(const el of document.querySelectorAll('.page'))el.classList.toggle('active',el.id===id)}

function home(){stopReflex();$('venue').value='';show('home')}

$('resultHome').onclick=home;$('formHome').onclick=home;
function backgrounds(){
 const manifest=window.APP_IMAGE_FILES||{};
 function url(folder){const name=manifest[folder];return name?'url("'+folder+'/'+encodeURIComponent(name)+'")':null}
 const common=url('3');
 for(const [folder,id] of [['1','homebg'],['9','formbg']]){
   const chosen=url(folder)||common;if(chosen)$(id).style.backgroundImage=chosen;
 }
 for(const p of document.querySelectorAll('.page:not(#home):not(#form)')){
   if(common){p.style.backgroundImage=common;p.style.backgroundSize='cover';p.style.backgroundPosition='center'}

}backgrounds();
function records(){try{const value=JSON.parse(localStorage.getItem('careerRecords')||'[]');return Array.isArray(value)?value:Object.values(value)}catch(e){return []}}
function saveRecord(r){const all=records();all.push(r);localStorage.setItem('careerRecords',JSON.stringify(all))}
let sendBusy=false;

function updateRecordLocation(id,lat,lon){try{const all=records();const rec=all.find(r=>r.localId===id);if(!rec)return;rec.lat=lat;rec.lon=lon;rec.located='緯度 '+lat.toFixed(5)+'、経度 '+lon.toFixed(5);localStorage.setItem('careerRecords',JSON.stringify(all))}catch(e){}}
$('send').onclick=()=>{
 if(sendBusy)return;
 const data={number:currentNumber,name:$('name').value.trim(),age:$('age').value.trim(),address:$('address').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim()};
 if([data.name,data.age,data.address,data.phone,data.email].some(x=>!x)){sendStatus('すべての項目を入力してください。');return}
 if(!/^\S+@\S+\.\S+$/.test(data.email)){sendStatus('メールアドレスの形式を確認してください。');return}
 const id=String(Date.now())+'-'+Math.random().toString(36).slice(2);
 const record={...data,localId:id,lat:null,lon:null,located:'位置情報なし',savedAt:new Date().toISOString()};

 const body='受験者番号：'+data.number+'\n氏名：'+data.name+'\n年齢：'+data.age+'\n住所：'+data.address+'\n電話番号：'+data.phone+'\nメールアドレス：'+data.email;
 const url='mailto:0gr7553.325544z@ezweb.ne.jp?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
 sendStatus('端末内に保存しました。メールアプリで内容を確認して送信してください。\n※メールアプリで送信を完了するまでは、メールは届きません。');
 window.location.href=url;
 // GPSはメール起動を妨げないよう後から任意取得。記録はこの端末内だけ。
 if(navigator.geolocation){setTimeout(()=>navigator.geolocation.getCurrentPosition(pos=>updateRecordLocation(id,pos.coords.latitude,pos.coords.longitude),()=>{}, {enableHighAccuracy:false,timeout:7000,maximumAge:60000}),500)}
};
function el(tag,txt,cls){const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;if(cls)x.className=cls;return x}function action(label,fn,primary=false){const b=el('button',label,primary?'primary':'');b.onclick=fn;$('questionactions').append(b)}function renderQuestion(){const area=$('questionarea'),actions=$('questionactions');area.replaceChildren();actions.replaceChildren();$('progress').textContent=(q+1)+' / 30';if(q<26){const entry=questions[q];$('questiontitle').textContent=entry[0];for(let i=1;i<=4;i++){const b=el('button',entry[i],'choice');b.onclick=()=>{answers.push(i-1);q++;renderQuestion()};area.append(b)}}else if(q<29){puzzleIndex=q-26;stacks=puzzles[puzzleIndex].start.map(a=>a.slice());$('questiontitle').textContent='ブロック積み替え '+(puzzleIndex+1);renderPuzzle()}else{$('questiontitle').textContent='瞬発力テスト';startReflex()}}
function svgBlock(c,x,y,w=66,h=26){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');for(const [k,v] of Object.entries({x,y,width:w,height:h,rx:3,fill:colors[c],stroke:'#333','stroke-width':1.5}))r.setAttribute(k,v);return r}function svgBase(view){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',view);return svg}function renderPuzzle(){const area=$('questionarea');area.replaceChildren();$('questionactions').replaceChildren();const target=el('div',undefined,'sample');target.append(el('div','完成見本','target'));const sample=svgBase('0 0 90 115');puzzles[puzzleIndex].target.forEach((c,i)=>sample.append(svgBlock(c,12,82-i*27,66,24)));target.append(sample);area.append(target,el('p','左右の山の一番上を中央に積んでください。','muted'));const grid=el('div',undefined,'stacks');['左','中央','右'].forEach((label,s)=>{const box=el('div',undefined,'stackbox');box.append(el('div',label,'caption'));const svg=svgBase('0 0 90 145');const line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d','M5 133H85');line.setAttribute('stroke','#333');line.setAttribute('stroke-width','2');svg.append(line);stacks[s].forEach((c,i)=>{const r=svgBlock(c,12,105-i*29);if(i===stacks[s].length-1){r.style.cursor='grab';r.addEventListener('pointerdown',e=>{e.preventDefault();drag={from:s,ptr:e.pointerId};document.addEventListener('pointerup',dropBlock,{once:true})})}svg.append(r)});box.append(svg);grid.append(box)});area.append(grid);action('やり直し',()=>{stacks=puzzles[puzzleIndex].start.map(a=>a.slice());renderPuzzle()});action('パス',()=>{q++;renderQuestion()});if(JSON.stringify(stacks[1])===JSON.stringify(puzzles[puzzleIndex].target))action('次へ',()=>{solved++;q++;renderQuestion()},true)}function dropBlock(e){if(!drag)return;const target=document.elementFromPoint(e.clientX,e.clientY);const box=target&&target.closest('.stackbox');const boxes=[...document.querySelectorAll('.stacks .stackbox')];const to=boxes.indexOf(box);const from=drag.from;drag=null;if(to>=0)move(from,to)}function move(from,to){if(from===to||!stacks[from].length)return;stacks[to].push(stacks[from].pop());renderPuzzle()}
function startReflex(){const area=$('questionarea');area.replaceChildren();$('questionactions').replaceChildren();area.append(el('p','本物の ⚡ だけを押してください。制限時間15秒。','muted'));const counter=el('div','残り 15.0 秒');area.append(counter);const grid=el('div',undefined,'reflexgrid');const cells=[];for(let i=0;i<9;i++){const cell=el('div',undefined,'cell');cell.addEventListener('pointerdown',()=>{if(!reflexRunning)return;const ok=activeSymbol&&activeSymbol.i===i&&activeSymbol.symbol==='⚡';if(ok)hits++;else misses++;flash.textContent=ok?'○':'×';flash.style.color=ok?'#e33434':'#237cdb';flash.classList.add('show');setTimeout(()=>flash.classList.remove('show'),240);if(activeSymbol&&activeSymbol.i===i)activeSymbol=null;cell.textContent=''});cells.push(cell);grid.append(cell)}const flash=el('div',undefined,'flash');grid.append(flash);area.append(grid);const start=performance.now();reflexRunning=true;function spawn(){if(!reflexRunning)return;cells.forEach(c=>c.textContent='');const i=Math.floor(Math.random()*9),symbol=['⚡','ϟ','↯'][Math.floor(Math.random()*3)];activeSymbol={i,symbol};cells[i].textContent=symbol;spawnTimer=setTimeout(spawn,symbol==='⚡'?800:650)}spawn();function tick(){if(!reflexRunning)return;const remain=Math.max(0,15-(performance.now()-start)/1000);counter.textContent='残り '+remain.toFixed(1)+' 秒';if(remain<=0){stopReflex();finish()}else reflexTimer=setTimeout(tick,50)}tick()}
function finish(){const accuracy=hits+misses?hits/(hits+misses):0;const score=solved*2+(accuracy>=.7?2:accuracy>=.4?1:0);const grades=['B⊕','B⊖','C⊕','C⊖'];const types=['リーダータイプ','分析タイプ','創造タイプ','サポートタイプ'];$('grade').textContent=grades[Math.floor(Math.random()*4)];$('typeResult').textContent=types[Math.floor(Math.random()*4)];$('grade').dataset.internalScore=String(score);show('result')}
let found=null;
$('lookupBtn').onclick=()=>{$('lookupResult').classList.add('hide');$('lookupStatus').classList.remove('hide');if($('lookupCode').value!=='1111'){$('lookupStatus').textContent='管理者コードが違います';return}const n=$('lookupNumber').value.trim();found=records().filter(r=>String(r.number)===n).sort((a,b)=>String(b.savedAt||'').localeCompare(String(a.savedAt||'')))[0];if(!found){$('lookupStatus').textContent='該当する受験者は見つかりません';return}$('lookupStatus').classList.add('hide');$('lookupResult').classList.remove('hide');$('lookupName').textContent='受験者番号：'+found.number+'　氏名：'+found.name;showAddress()};
function showAddress(){$('lookupAddress').classList.remove('hide');$('lookupMap').classList.add('hide');$('lookupAddress').textContent=found?.located||'位置情報なし'}
$('addrBtn').onclick=showAddress;
$('mapBtn').onclick=()=>{$('lookupAddress').classList.add('hide');$('lookupMap').classList.remove('hide');const map=$('lookupMap');map.replaceChildren();if(found?.lat==null||found?.lon==null){map.textContent='位置情報なし';return}const frame=document.createElement('iframe');frame.title='記録地点の地図';frame.referrerPolicy='no-referrer';const lat=Number(found.lat),lon=Number(found.lon),d=.008;frame.src='https://www.openstreetmap.org/export/embed.html?bbox='+encodeURIComponent([lon-d,lat-d,lon+d,lat+d].join(','))+'&layer=mapnik&marker='+encodeURIComponent(lat+','+lon);map.append(frame)};
document.querySelectorAll('.backHome').forEach(b=>b.onclick=home);
})();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
